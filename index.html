<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Francisco ❤️</title>
<style>
body {
 margin: 0;
 font-family: Arial, sans-serif;
 background: linear-gradient(135deg, #111111, #3a1f2b);
 color: white;
 text-align: center;
}
.container {
 min-height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
 padding: 25px;
 box-sizing: border-box;
}
.card {
 max-width: 500px;
 width: 100%;
 background: rgba(255,255,255,0.10);
 border-radius: 25px;
 padding: 30px 20px;
 box-sizing: border-box;
}
h1 {
 font-size: 32px;
}
.photo {
 width: 100%;
 max-width: 400px;
 border-radius: 20px;
 margin: 20px auto;
 display: block;
}
.message {
 font-size: 19px;
 line-height: 1.6;
}
.music {
 display: inline-block;
 margin-top: 20px;
 padding: 15px 25px;
 background: white;
 color: #222;
 border-radius: 30px;
 text-decoration: none;
 font-weight: bold;
 font-size: 17px;
}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>❤️ Para Francisco ❤️</h1>
<img src="Img_8416.jpeg" class="photo" alt="Francisco">
<p class="message">
     Hoy quiero recordarte lo especial que eres para mí.
<br><br>
     Espero que este cumpleaños esté lleno de momentos bonitos,
     sonrisas y mucho amor.
<br><br>
     ✨ ¡Feliz cumpleaños, Francisco! ✨
</p>
<p>🎵 Una canción para ti</p>
<a class="music"
      href="https://www.youtube.com/watch?v=qiOW60YFDPs"
      target="_blank">
      🎵 Escuchar “Llegaste Tú”
</a>
</div>
</div>
</body>
</html>
